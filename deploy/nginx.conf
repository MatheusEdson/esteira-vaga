# Publicacao da esteira num dominio proprio, com gate por chave.
#
# A API nao tem autenticacao: ela assume que so' voce a alcanca. Entao o nginx e' o
# unico portao. Duas regras que nao sao opcionais:
#   1. o uvicorn escuta 127.0.0.1, nunca 0.0.0.0 exposto
#   2. tudo em /esteira exige ?key=, inclusive /esteira-api
#
# O mesmo padrao ja usado em /objais no seudominio.com.

# ---------------------------------------------------------------------------
# Recorte para colar num server{} existente
# ---------------------------------------------------------------------------

# Front: gate por chave, fora de indexador
location ^~ /esteira {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # TROQUE a chave. Gere com:
    #   python -c "import secrets; print(secrets.token_urlsafe(16))"
    if ($arg_key != "TROQUE-ESTA-CHAVE") { return 403; }

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $esteira_host esteira-vagas;

    # GOTCHA que custou uma rodada de teste: com VARIAVEL no proxy_pass o nginx NAO
    # substitui o prefixo da location automaticamente, nem com a barra final. Sem este
    # rewrite todo request cai em "/" no container, e /esteira/api/stats devolve o HTML
    # do front com 200 -- parece que funcionou, e nao funcionou. O sinal e' o
    # content-type: tres rotas diferentes voltando o MESMO tamanho em bytes.
    rewrite ^/esteira/(.*)$ /$1 break;
    proxy_pass http://$esteira_host:8099;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 10m;
}

# sem a barra final o caminho relativo do front quebra
location = /esteira {
    return 301 /esteira/$is_args$args;
}

# API: o front chama /esteira-api/... e o nginx tira o prefixo.
# Precisa do MESMO gate: sem isso, a API fica aberta e o gate do front nao vale nada.
location ^~ /esteira-api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($arg_key != "TROQUE-ESTA-CHAVE") { return 403; }

    rewrite ^/esteira-api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# ---------------------------------------------------------------------------
# GOTCHA de nginx que ja custou caro neste dominio
#
# Se o server{} tiver fallback de SPA como `location / { try_files $uri /index.html; }`,
# uma rota nova SEM `^~` cai no fallback e serve a home em vez do app. O `^~` acima
# garante prioridade sobre o fallback. Foi exatamente isso que aconteceu ao publicar
# /portfolio: devolvia a home com 200, parecendo que estava tudo certo.
# ---------------------------------------------------------------------------
